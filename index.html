<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classificação Geral 2026 — Circuito Sicoob de Xadrez Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0; --paper:#FFFFFF; --ink:#12211F; --muted:#5C6E6B; --line:#D6DEDC;
  --petrol:#003641; --petrol-2:#0A4A56; --turq:#00AE9D; --turq-soft:#E2F4F1; --lime:#C9D200;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;
  font-feature-settings:"tnum" 1;
}
.wrap{max-width:1140px;margin:0 auto;padding:0 14px 72px}
header{padding:26px 0 18px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{display:block}
.logo-circ{height:124px;width:auto;flex:0 0 auto;filter:drop-shadow(0 3px 8px rgba(0,54,65,.18))}
.logo-sicoob{height:44px;width:auto;margin-left:auto;border-radius:6px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
   font-size:clamp(23px,5.2vw,42px);line-height:1.04;letter-spacing:-.02em;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-size:clamp(14px,3.4vw,17px)}
.sub b{color:var(--petrol);font-weight:600}
nav{display:flex;gap:7px;overflow-x:auto;padding:18px 0 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  font:inherit;font-weight:600;font-size:15px;padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--turq)}
.tab[aria-selected="true"]{background:var(--petrol);border-color:var(--petrol);color:#fff}
.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1 1 260px;min-width:0}
input[type="search"],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:11px;padding:12px 14px}
select{flex:0 1 250px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:14px 0 12px;font-size:13.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.sw{width:15px;height:15px;border-radius:4px;flex:0 0 auto}
.sw.a{background:var(--petrol)} .sw.b{background:var(--turq-soft);border:1.5px solid var(--turq)}
.count{margin-left:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 12px}
thead th{font-size:13px;font-weight:600;color:#DCE8E6;background:var(--petrol);position:sticky;top:0;z-index:2}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.p{border-bottom:1px solid var(--line)}
td.pos{width:60px;font-variant-numeric:tabular-nums;color:var(--muted)}
td.name{font-weight:500}
td.school{color:var(--muted)}
td.total{width:80px;font-weight:700}
tr.t1{background:var(--petrol);color:#fff}
tr.t1 td{padding-top:15px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.14)}
tr.t1 td.name{font-weight:700;font-size:1.06em;color:#fff}
tr.t1 td.school{color:#A8C6C4}
tr.t1 td.num{color:#DDE9E7}
tr.t1 td.total{color:var(--lime);font-size:1.1em}
.badge{display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--petrol);
  font-weight:700;font-size:15px}
tr.t1 td.pos{padding-left:14px}
tr.t2{background:var(--turq-soft)}
tr.t2 td{padding-top:13px;padding-bottom:13px}
tr.t2 td.pos{box-shadow:inset 4px 0 0 var(--turq);color:var(--petrol);font-weight:700}
tr.t2 td.name{font-weight:600}
tr.t2 td.school{color:#4E6F6C}
tr.t2 td.total{color:var(--petrol)}
tr.t2.cut{border-bottom:3px solid var(--turq)}
tr.t3:nth-child(4n+3){background:#F6F8F7}
mark{background:#EAF08F;color:inherit;border-radius:2px}
tr.t1 mark{background:#4E7C2E;color:#fff}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
tr.det{display:none}
tr.det td{padding-top:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#EDF2F1;border-radius:8px;padding:5px 10px;font-variant-numeric:tabular-nums}
.chip b{font-weight:700;color:var(--ink)}
tr.t1 .chip{background:rgba(255,255,255,.14);color:#DDE9E7}
tr.t1 .chip b{color:#fff}
footer{margin-top:24px;color:var(--muted);font-size:13.5px}
@media (max-width:760px){
  th.st,td.st,th.rt,td.rt{display:none}
  tr.det.open{display:table-row}
  tbody tr.p{cursor:pointer}
  th,td{padding:11px 8px}
  td.pos{width:46px}
  td.total{width:64px}
  td.name{font-size:15.5px}
  td.school{font-size:13px;display:block;margin-top:2px}
  tr.t1 td.name{font-size:16.5px}
  .badge{width:28px;height:28px;font-size:14.5px}
  .brand{flex-wrap:wrap;gap:12px}
  .logo-circ{height:104px}
  .logo-sicoob{height:38px}
  .brand .txt{flex:1 1 100%;order:3}
}
@media print{
  body{background:#fff}
  nav,.controls{display:none}
  .card{border:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:no-preference){.tab{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>

const $ = s => document.querySelector(s);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const fmt = n => (n === null || n === undefined) ? "—" : n.toLocaleString("pt-BR",{maximumFractionDigits:1});
let cat = 0;
const tabs = $("#tabs");
DATA.forEach((d,i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.role = "tab"; b.textContent = d.cat;
  b.setAttribute("aria-selected", i === 0);
  b.onclick = () => { cat = i; [...tabs.children].forEach((c,j)=>c.setAttribute("aria-selected", j===i));
    $("#q").value=""; buildSchools(); render(); window.scrollTo({top:0}); };
  tabs.appendChild(b);
});
function buildSchools(){
  const list = [...new Set(DATA[cat].rows.map(r => r.c))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  $("#school").innerHTML = '<option value="">Todos os colégios</option>' + list.map(s=>`<option>${s}</option>`).join("");
}
function buildHead(){
  $("#thead").innerHTML =
    '<th class="num" style="width:60px">#</th><th>Aluno</th><th>Colégio</th><th class="num rt">Rating</th>' +
    DATA[cat].stages.map(s=>`<th class="num st">${s} etapa</th>`).join("") +
    '<th class="num">Total</th>';
}
function hl(text, q){
  if(!q) return text;
  const i = norm(text).indexOf(q);
  if(i < 0) return text;
  return text.slice(0,i) + "<mark>" + text.slice(i,i+q.length) + "</mark>" + text.slice(i+q.length);
}
function render(){
  buildHead();
  const q = norm($("#q").value.trim());
  const school = $("#school").value;
  const filtered = !!(q || school);
  const st = DATA[cat].stages;
  const rows = DATA[cat].rows.filter(r =>
    (!school || r.c === school) && (!q || norm(r.n).includes(q) || norm(r.c).includes(q)));
  const tb = $("#tbody"); tb.innerHTML = "";
  const frag = document.createDocumentFragment();
  rows.forEach(r => {
    const tier = r.p <= 5 ? "t1" : (r.p <= 20 ? "t2" : "t3");
    const tr = document.createElement("tr");
    tr.className = "p " + tier + (!filtered && r.p === 20 ? " cut" : "");
    tr.innerHTML =
      `<td class="pos num">${tier === "t1" ? `<span class="badge">${r.p}</span>` : r.p}</td>` +
      `<td class="name">${hl(r.n,q)}</td>` +
      `<td class="school">${hl(r.c,q)}</td>` +
      `<td class="num rt">${r.r ? r.r : "—"}</td>` +
      r.e.map(v=>`<td class="num st">${fmt(v)}</td>`).join("") +
      `<td class="num total">${fmt(r.t)}</td>`;
    const det = document.createElement("tr");
    det.className = "det " + tier;
    det.innerHTML = `<td></td><td colspan="${3 + st.length}"><div class="chips">` +
      st.map((s,i)=>`<span class="chip">${s} etapa <b>${fmt(r.e[i])}</b></span>`).join("") +
      (r.r ? `<span class="chip">Rating <b>${r.r}</b></span>` : "") + `</div></td>`;
    tr.onclick = () => det.classList.toggle("open");
    frag.appendChild(tr); frag.appendChild(det);
  });
  tb.appendChild(frag);
  $("#empty").hidden = rows.length > 0;
  $("#count").textContent = filtered
    ? `${rows.length} de ${DATA[cat].rows.length} alunos`
    : `${rows.length} alunos nesta categoria`;
  $("#foot").textContent = `${st.length} etapas computadas · ${DATA.reduce((a,d)=>a+d.rows.length,0)} alunos no circuito`;
}
$("#q").addEventListener("input", render);
$("#school").addEventListener("change", render);
buildSchools(); render();
